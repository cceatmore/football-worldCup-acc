<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>足球彩票盈亏记账</title>
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <div class="app-shell">
      <main class="main-content">
        <!-- 记账页 -->
        <section id="ledger-view" class="view-panel">
          <header class="page-header">
            <h1>盈亏记账</h1>
            <button id="add-entry-btn" class="add-btn" type="button">+ 新增</button>
          </header>

          <div class="table-wrap">
            <table class="ledger-table">
              <colgroup>
                <col />
                <col />
                <col />
                <col />
                <col />
                <col />
                <col />
              </colgroup>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>投入</th>
                  <th>中否</th>
                  <th>奖金</th>
                  <th>净赚</th>
                  <th>总计</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="ledger-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state hidden">
              <p>暂无记录，点击「新增」添加第一条</p>
            </div>
          </div>
        </section>

        <!-- 折线图页 -->
        <section id="chart-view" class="view-panel hidden">
          <header class="page-header">
            <h1>盈利趋势</h1>
          </header>

          <div class="chart-range-bar" role="group" aria-label="时间范围">
            <button class="range-btn active" type="button" data-range="week">近一周</button>
            <button class="range-btn" type="button" data-range="month">近一个月</button>
            <button class="range-btn" type="button" data-range="3months">近三个月</button>
            <button class="range-btn" type="button" data-range="6months">近半年</button>
            <button class="range-btn" type="button" data-range="year">近一年</button>
          </div>

          <div class="chart-card">
            <canvas id="profit-chart" aria-label="累计盈利折线图"></canvas>
            <div id="chart-empty" class="chart-empty hidden">所选时间范围内暂无数据</div>
          </div>

          <div class="chart-summary">
            <div class="summary-item">
              <span>区间盈利</span>
              <strong id="range-profit">0</strong>
            </div>
            <div class="summary-item">
              <span>当前总计</span>
              <strong id="total-profit">0</strong>
            </div>
          </div>
        </section>
      </main>

      <!-- 底部 TabBar -->
      <nav class="tabbar" role="tablist" aria-label="主导航">
        <button id="tab-ledger" class="tabbar-item active" type="button" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"/></svg>
          <span>记账</span>
        </button>
        <button id="tab-chart" class="tabbar-item" type="button" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h2v-4H3v4zm4 0h2V7H7v10zm4 0h2v-6h-2v6zm4 0h2v-9h-2v9zm4 0h2V4h-2v13z"/></svg>
          <span>趋势</span>
        </button>
      </nav>
    </div>

    <div id="add-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-card">
        <h2 id="add-modal-title">新增记录</h2>
        <label class="modal-field" for="add-investment-input">
          <span>投入</span>
          <input id="add-investment-input" type="text" inputmode="decimal" placeholder="请输入投入金额" autocomplete="off" />
        </label>
        <p class="modal-hint">时间、中否、净赚、总计自动计算，奖金可稍后在表格中补填</p>
        <div class="modal-actions">
          <button type="button" class="modal-btn cancel" data-close-modal>取消</button>
          <button type="button" class="modal-btn confirm" id="add-confirm-btn">确定</button>
        </div>
      </div>
    </div>

    <script src="./ledger.js?v=6"></script>
    <script src="./app.js?v=6"></script>
  </body>
</html>
